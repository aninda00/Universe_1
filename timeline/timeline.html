<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Universe_1 — Timeline</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", sans-serif;
    background: radial-gradient(ellipse at 50% 0%, #14192b 0%, #0a0c14 60%);
    color: #e8ecf7;
    margin: 0;
    overflow: hidden;
    height: 100vh;
  }
  h1 {
    position: absolute;
    top: 20px;
    left: 28px;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 0.3px;
    margin: 0;
    z-index: 10;
    color: #9db4ff;
    text-shadow: 0 0 20px rgba(90,120,255,0.4);
  }
  #hint {
    position: absolute;
    top: 24px;
    right: 28px;
    font-size: 12px;
    color: #5a6584;
    z-index: 10;
  }
  #err { position: absolute; top: 60px; left: 28px; color: #ff7b7b; font-size: 13px; z-index: 10; }
  svg { width: 100vw; height: 100vh; display: block; cursor: grab; }
  svg:active { cursor: grabbing; }

  .node-box {
    fill: rgba(20, 26, 46, 0.92);
    stroke-width: 1.5;
    rx: 10;
  }
  .node-box { stroke: #7a8fe0; }
  .dot { fill: #7a8fe0; filter: drop-shadow(0 0 6px #7a8fe0aa); }
  .label { fill: #cdd7ff; }
  .desc { fill: #7f8bb5; }
  .label { font-size: 13px; font-weight: 600; }
  .desc { font-size: 11px; }
  .icon { font-size: 15px; }
  .path-line { fill: none; stroke: url(#pathGrad); stroke-width: 2.5; opacity: 0.7; }

  .node { cursor: pointer; }
  .node .node-box { transition: stroke-width 0.2s ease, filter 0.2s ease; }
  .node:hover .node-box { stroke-width: 2.5; filter: drop-shadow(0 0 12px rgba(120,150,255,0.5)); }
</style>
</head>
<body>
<h1>Universe_1 — Timeline</h1>
<div id="hint">scroll to zoom · drag to pan</div>
<div id="err"></div>
<svg id="svg"></svg>

<script>
async function loadAndRender() {
  const errEl = document.getElementById('err');
  let text;
  try {
    const res = await fetch('timeline.md');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    text = await res.text();
  } catch (e) {
    errEl.textContent = 'Could not load timeline.md: ' + e.message;
    text = FALLBACK;
  }
  render(text);
}

const FALLBACK = `# Timeline
- ~13.8 bya - Universe begins
- ~4.5 bya - Earth forms
- ~300,000 ya - Homo sapiens emerge
- 3000 BC - First civilizations
- 1969 AD - Moon landing
- 2026 AD - Present day
- [gap - TBD: space colonization begins]
- 3056 AD - The War of Chaos
- [gap - TBD: survival religion forms]
- [TBD] - Milky Way fully colonized
- [TBD] - First contact/tension with Andromeda
- [Present of story] - ?`;

function parseTimeline(text) {
  const lines = text.split(/\r?\n/);
  const events = [];
  for (const raw of lines) {
    const line = raw.trim();
    const item = line.match(/^-\s+(.*)/);
    if (!item) continue;
    const content = item[1];
    let label, desc, future = false;
    const dash = content.indexOf(' - ');
    if (content.startsWith('[') && content.includes(']')) {
      label = content.match(/\[(.*?)\]/)[1];
      desc = content.slice(content.indexOf(']') + 1).replace(/^\s*-\s*/, '').trim();
      future = true;
    } else if (dash > -1) {
      label = content.slice(0, dash).trim();
      desc = content.slice(dash + 3).trim();
    } else {
      label = content;
      desc = '';
    }
    if (/AD\b/.test(label)) {
      const yr = parseInt(label);
      if (!isNaN(yr) && yr > 2026) future = true;
    }
    events.push({ label, desc, future });
  }
  return events;
}

function render(text) {
  const events = parseTimeline(text);
  if (!events.length) {
    document.getElementById('err').textContent = 'No events parsed.';
    return;
  }

  const svg = d3.select('#svg');
  const width = window.innerWidth;
  const height = window.innerHeight;
  const spacing = 260;
  const midY = height / 2;
  const amp = 90;

  const defs = svg.append('defs');
  const grad = defs.append('linearGradient').attr('id', 'pathGrad')
    .attr('x1', '0%').attr('x2', '100%');
  grad.append('stop').attr('offset', '0%').attr('stop-color', '#4a8fe7');
  grad.append('stop').attr('offset', '60%').attr('stop-color', '#7a6fe0');
  grad.append('stop').attr('offset', '100%').attr('stop-color', '#e2703a');

  const g = svg.append('g');

  const points = events.map((e, i) => {
    const x = 100 + i * spacing;
    const y = midY + Math.sin(i * 0.9) * amp;
    return { ...e, x, y, i };
  });

  const line = d3.line()
    .x(d => d.x)
    .y(d => d.y)
    .curve(d3.curveCatmullRom.alpha(0.8));

  const path = g.append('path')
    .datum(points)
    .attr('class', 'path-line')
    .attr('d', line);

  const totalLength = path.node().getTotalLength();
  path
    .attr('stroke-dasharray', totalLength + ' ' + totalLength)
    .attr('stroke-dashoffset', totalLength)
    .transition()
    .duration(1800)
    .ease(d3.easeCubicOut)
    .attr('stroke-dashoffset', 0);

  const nodeG = g.selectAll('.node')
    .data(points)
    .enter()
    .append('g')
    .attr('class', d => 'node ' + (d.future ? 'node-future' : 'node-past'))
    .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')')
    .attr('opacity', 0);

  nodeG.transition()
    .delay((d, i) => 200 + i * 120)
    .duration(500)
    .ease(d3.easeBackOut)
    .attr('opacity', 1);

  nodeG.append('circle').attr('class', 'dot').attr('r', 6);

  const above = (d, i) => i % 2 === 0;

  nodeG.each(function(d, i) {
    const grp = d3.select(this);
    const isAbove = above(d, i);
    const boxW = 176;
    const boxH = d.desc ? 52 : 34;
    const boxY = isAbove ? -boxH - 20 : 20;

    grp.append('rect')
      .attr('class', 'node-box')
      .attr('x', -boxW / 2)
      .attr('y', boxY)
      .attr('width', boxW)
      .attr('height', boxH);

    grp.append('text')
      .attr('class', 'icon')
      .attr('x', -boxW / 2 + 16)
      .attr('y', boxY + 22)
      .attr('text-anchor', 'middle')
      .text(d.future ? '\u2726' : '\u25C9');

    grp.append('text')
      .attr('class', 'label')
      .attr('x', 6)
      .attr('y', boxY + 21)
      .attr('text-anchor', 'middle')
      .text(truncate(d.label, 22));

    if (d.desc) {
      grp.append('text')
        .attr('class', 'desc')
        .attr('x', 6)
        .attr('y', boxY + 40)
        .attr('text-anchor', 'middle')
        .text(truncate(d.desc, 28));
    }

    grp.append('line')
      .attr('x1', 0).attr('y1', 0)
      .attr('x2', 0).attr('y2', isAbove ? -20 : 20)
      .attr('stroke', d.future ? '#e2703a' : '#4a8fe7')
      .attr('stroke-width', 1.5)
      .attr('opacity', 0.5);
  });

  const zoom = d3.zoom()
    .scaleExtent([0.3, 3])
    .on('zoom', (event) => {
      g.attr('transform', event.transform);
    });

  svg.call(zoom);

  const initialScale = 0.85;
  const initialX = width / 2 - points[0].x * initialScale;
  svg.call(zoom.transform, d3.zoomIdentity.translate(initialX, 0).scale(initialScale));

  function truncate(s, n) {
    return s.length > n ? s.slice(0, n - 1) + '\u2026' : s;
  }
}

loadAndRender();
</script>
</body>
</html>
